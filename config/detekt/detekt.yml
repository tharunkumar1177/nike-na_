# Framecraft detekt overrides layered on the default rule set.
naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

complexity:
  LongParameterList:
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreEnums: true
    excludes:
      - '**/test/**'
