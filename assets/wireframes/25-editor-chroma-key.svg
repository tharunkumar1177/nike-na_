<!--
  Framecraft wireframe: editor, chroma key panel docked under the preview while picking a color.
  390x844 dp, dark theme; rules in assets/wireframes/style.md.
  Spec: assets/wireframes/masks-slice15.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <style>
    text{font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:14px;fill:#E2E2E9}
    .tl{font-size:22px;font-weight:500}.ll{font-weight:500}
    .bm{fill:#C4C6D0}.p{fill:#AEC6FF}.sc{fill:#E8DEF8}.m{text-anchor:middle}.e{text-anchor:end}
  </style>
  <defs>
    <g id="i-back"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></g>
    <g id="i-undo"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></g>
    <g id="i-redo"><path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7z"/></g>
    <g id="i-export"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></g>
    <g id="i-prev"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></g>
    <g id="i-play"><path fill="currentColor" d="M8 5v14l11-7z"/></g>
    <g id="i-next"><path fill="currentColor" d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></g>
    <g id="i-dropper" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4l4 4-2 2-4-4zM14 8l-8 8-1 3 3-1 8-8"/></g>
  </defs>

  <rect width="390" height="844" fill="#111318"/>
  <text x="16" y="17" class="ll">9:41</text>
  <path fill="#E2E2E9" d="M330 9h10v8h-10zM346 17h12V7zM362 7h7v11h-7z"/>
  <g color="#E2E2E9"><use href="#i-back" x="16" y="44"/><use href="#i-undo" x="262" y="44"/><use href="#i-redo" x="302" y="44" opacity=".38"/><use href="#i-export" x="350" y="44"/></g>
  <text x="56" y="63" class="tl">Summer Vacation</text>

  <!-- Preview: green-screen clip, dashed clip outline while picking, reticle at the last tap -->
  <rect y="88" width="390" height="300" fill="#000"/>
  <rect y="129" width="390" height="219" fill="#2F7D3A"/>
  <circle cx="195" cy="210" r="28" fill="#3A3E46"/>
  <path d="M135 348c0-56 27-98 60-98s60 42 60 98z" fill="#3A3E46"/>
  <rect x="2" y="131" width="386" height="215" fill="none" stroke="#AEC6FF" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="310" cy="180" r="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M310 162v8M310 190v8M292 180h8M320 180h8" stroke="#FFFFFF" stroke-width="2"/>

  <g color="#E2E2E9"><use href="#i-prev" x="16" y="400"/><use href="#i-play" x="64" y="400"/><use href="#i-next" x="112" y="400"/></g>
  <text x="374" y="417" class="bm e">0:05 / 1:23</text>

  <!-- Docked chroma key panel -->
  <rect y="436" width="390" height="408" fill="#1D1B20"/>
  <text x="16" y="478" class="tl">Chroma key</text>
  <text x="362" y="478" class="ll p e">Done</text>

  <circle cx="34" cy="516" r="16" fill="#2F7D3A" stroke="#E2E2E9" stroke-width="2"/>
  <rect x="60" y="496" width="128" height="40" rx="20" fill="#4A4458"/>
  <use href="#i-dropper" x="74" y="504" color="#E8DEF8"/>
  <text x="106" y="521" class="ll sc">Pick color</text>
  <rect x="196.5" y="500.5" width="83" height="31" rx="8" fill="none" stroke="#938F99"/>
  <circle cx="214" cy="516" r="5" fill="#2F7D3A"/>
  <text x="248" y="521" class="ll bm m">Green</text>
  <rect x="288.5" y="500.5" width="75" height="31" rx="8" fill="none" stroke="#938F99"/>
  <circle cx="306" cy="516" r="5" fill="#1E5AA8"/>
  <text x="336" y="521" class="ll bm m">Blue</text>

  <text x="16" y="566" class="bm">Tap the color to remove in the preview</text>

  <text x="16" y="600" class="bm">Strength 50</text>
  <rect x="16" y="618" width="358" height="4" rx="2" fill="#44474E"/>
  <rect x="16" y="618" width="179" height="4" rx="2" fill="#AEC6FF"/>
  <circle cx="195" cy="620" r="10" fill="#AEC6FF"/>

  <text x="16" y="654" class="bm">Softness 20</text>
  <rect x="16" y="672" width="358" height="4" rx="2" fill="#44474E"/>
  <rect x="16" y="672" width="72" height="4" rx="2" fill="#AEC6FF"/>
  <circle cx="88" cy="674" r="10" fill="#AEC6FF"/>

  <text x="16" y="708" class="bm">Spill removal 50</text>
  <rect x="16" y="726" width="358" height="4" rx="2" fill="#44474E"/>
  <rect x="16" y="726" width="179" height="4" rx="2" fill="#AEC6FF"/>
  <circle cx="195" cy="728" r="10" fill="#AEC6FF"/>

  <text x="28" y="782" class="ll p">Remove</text>

  <rect x="141" y="832" width="108" height="4" rx="2" fill="#E2E2E9"/>
</svg>
