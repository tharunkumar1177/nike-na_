  <g fill="#AEC6FF"><circle cx="230" cy="132" r="6"/><circle cx="152" cy="156" r="3"/><circle cx="308" cy="156" r="3"/><circle cx="152" cy="244" r="3"/><circle cx="308" cy="244" r="3"/></g>

  <g color="#E2E2E9"><use href="#i-prev" x="16" y="400"/><use href="#i-play" x="64" y="400"/><use href="#i-next" x="112" y="400"/></g>
