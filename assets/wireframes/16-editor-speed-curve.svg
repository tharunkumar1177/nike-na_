<!--
  Framecraft wireframe: editor, speed sheet on the Curve tab.
  390x844 dp, dark theme; rules in assets/wireframes/style.md.
  Spec: assets/wireframes/speed-slice11.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <style>
    text{font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:14px;fill:#E2E2E9}
    .tl{font-size:22px;font-weight:500}.bl{font-size:16px}.ll{font-weight:500}.ls{font-size:11px;fill:#C4C6D0}
    .bm{fill:#C4C6D0}.p{fill:#AEC6FF}.sc{fill:#E8DEF8}.m{text-anchor:middle}.e{text-anchor:end}
  </style>
  <defs>
    <g id="i-back"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></g>
    <g id="i-undo"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></g>
    <g id="i-redo"><path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7z"/></g>
    <g id="i-export"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></g>
  </defs>

  <rect width="390" height="844" fill="#111318"/>
  <text x="16" y="17" class="ll">9:41</text>
  <path fill="#E2E2E9" d="M330 9h10v8h-10zM346 17h12V7zM362 7h7v11h-7z"/>
  <g color="#E2E2E9"><use href="#i-back" x="16" y="44"/><use href="#i-undo" x="262" y="44"/><use href="#i-redo" x="302" y="44" opacity=".38"/><use href="#i-export" x="350" y="44"/></g>
  <text x="56" y="63" class="tl">Summer Vacation</text>
  <rect y="88" width="390" height="300" fill="#000"/>
  <rect y="129" width="390" height="219" fill="#2A2D34"/>
  <circle cx="300" cy="180" r="18" fill="#3A3E46"/>
  <path d="M0 348 100 236l70 64 60-50 160 98z" fill="#3A3E46"/>

  <rect width="390" height="844" fill="#000" opacity=".32"/>
  <rect y="260" width="390" height="612" rx="28" fill="#1D1B20"/>
  <rect x="179" y="282" width="32" height="4" rx="2" fill="#C4C6D0" opacity=".4"/>
  <text x="16" y="324" class="tl">Speed</text>
  <text x="97" y="363" class="ll bm m">Normal</text>
  <text x="292" y="363" class="ll p m">Curve</text>
  <rect x="273" y="379" width="40" height="3" rx="1.5" fill="#AEC6FF"/>
  <rect y="382" width="390" height="1" fill="#44474E"/>

  <!-- Preset chips, scroll sideways -->
  <rect x="16" y="398" width="72" height="32" rx="8" fill="#4A4458"/>
  <text x="52" y="419" class="ll sc m">Custom</text>
  <rect x="96.5" y="398.5" width="79" height="31" rx="8" fill="none" stroke="#938F99"/>
  <text x="136" y="419" class="ll bm m">Montage</text>
  <rect x="184.5" y="398.5" width="55" height="31" rx="8" fill="none" stroke="#938F99"/>
  <text x="212" y="419" class="ll bm m">Hero</text>
  <rect x="248.5" y="398.5" width="63" height="31" rx="8" fill="none" stroke="#938F99"/>
  <text x="280" y="419" class="ll bm m">Bullet</text>
  <rect x="320.5" y="398.5" width="83" height="31" rx="8" fill="none" stroke="#938F99"/>
  <text x="362" y="419" class="ll bm m">Jump Cut</text>

  <!-- Curve editor: log speed 0.1x (bottom) to 10x (top) across the clip's source -->
  <rect x="16" y="446" width="358" height="240" rx="12" fill="#44474E"/>
  <path d="M16 566h358" stroke="#938F99" stroke-dasharray="4 4"/>
  <text x="24" y="478" class="ls">10x</text>
  <text x="24" y="560" class="ls">1x</text>
  <text x="24" y="678" class="ls">0.1x</text>
  <rect x="159" y="446" width="2" height="240" fill="#E2E2E9"/>
  <path d="M28 566 110 518l85 78 85-90 82 60" fill="none" stroke="#AEC6FF" stroke-width="2"/>
  <g fill="#AEC6FF" stroke="#44474E" stroke-width="2">
    <circle cx="28" cy="566" r="8"/><circle cx="110" cy="518" r="8"/><circle cx="195" cy="596" r="8"/>
    <circle cx="280" cy="506" r="8"/><circle cx="362" cy="566" r="8"/>
  </g>

  <rect x="16" y="702" width="104" height="40" rx="20" fill="#4A4458"/>
  <text x="68" y="727" class="ll sc m">Add point</text>
  <rect x="128.5" y="702.5" width="79" height="39" rx="19.5" fill="none" stroke="#938F99"/>
  <text x="168" y="727" class="ll p m">Reset</text>

  <text x="16" y="772" class="bm">Duration: 5.0s &#8594; 3.1s</text>
  <text x="16" y="807" class="bl">Maintain audio pitch</text>
  <rect x="322" y="786" width="52" height="32" rx="16" fill="#AEC6FF"/>
  <circle cx="358" cy="802" r="12" fill="#002E69"/>

  <rect x="141" y="832" width="108" height="4" rx="2" fill="#E2E2E9"/>
</svg>
