  <path fill="#E2E2E9" d="M330 9h10v8h-10zM346 17h12V7zM362 7h7v11h-7z"/>
  <g color="#E2E2E9"><use href="#i-back" x="16" y="44"/><use href="#i-undo" x="262" y="44"/><use href="#i-redo" x="302" y="44" opacity=".38"/><use href="#i-export" x="350" y="44"/></g>
  <text x="56" y="63" class="tl">Summer Vacation</text>
  <rect y="88" width="390" height="300" fill="#000"/>
  <rect y="129" width="390" height="219" fill="#2A2D34"/>
  <circle cx="300" cy="180" r="18" fill="#3A3E46"/>
  <path d="M0 348 100 236l70 64 60-50 160 98z" fill="#3A3E46"/>
  <text x="195" y="248" class="tx m">Summer trip</text>
  <rect x="110" y="214" width="170" height="44" fill="none" stroke="#AEC6FF" stroke-width="2"/>

  <!-- Scrim and text sheet -->
  <rect width="390" height="844" fill="#000" opacity=".32"/>
  <rect y="380" width="390" height="492" rx="28" fill="#1D1B20"/>
  <rect x="179" y="402" width="32" height="4" rx="2" fill="#C4C6D0" opacity=".4"/>

