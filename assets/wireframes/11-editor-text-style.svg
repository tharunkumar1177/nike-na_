  <text x="58" y="697" class="ll sc m">Outline</text>
  <rect x="108.5" y="676.5" width="79" height="31" rx="8" fill="none" stroke="#938F99"/>
  <text x="148" y="697" class="ll bm m">Shadow</text>
  <rect x="196.5" y="676.5" width="107" height="31" rx="8" fill="none" stroke="#938F99"/>
