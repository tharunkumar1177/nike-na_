<!--
  Framecraft wireframe: editor, text sheet on the Style tab.
  390x844 dp, dark theme; rules in assets/wireframes/style.md. Keyboard not drawn.
  Spec: assets/wireframes/text-slice9.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <style>
    text{font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:14px;fill:#E2E2E9}
    .tl{font-size:22px;font-weight:500}.bl{font-size:16px}.ll{font-weight:500}.lm{font-size:12px;font-weight:500;fill:#C4C6D0}
    .bm{fill:#C4C6D0}.p{fill:#AEC6FF}.op{fill:#002E69}.sc{fill:#E8DEF8}.m{text-anchor:middle}
    .tx{font-size:28px;font-weight:700;fill:#fff}
  </style>
  <defs>
    <g id="i-back"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></g>
    <g id="i-undo"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></g>
    <g id="i-redo"><path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7z"/></g>
    <g id="i-export"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></g>
    <clipPath id="sg"><rect x="16" y="724" width="252" height="40" rx="20"/></clipPath>
  </defs>

  <!-- Editor behind the sheet; the text being edited shows on the preview -->
  <rect width="390" height="844" fill="#111318"/>
