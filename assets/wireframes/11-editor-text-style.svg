  <rect x="100" y="724" width="84" height="40" fill="#4A4458" clip-path="url(#sg)"/>
  <rect x="16.5" y="724.5" width="251" height="39" rx="19.5" fill="none" stroke="#938F99"/>
  <path d="M100 724v40M184 724v40" stroke="#938F99"/>
  <text x="58" y="749" class="ll m">Left</text>
  <text x="142" y="749" class="ll sc m">Center</text>
