<!--
  Framecraft wireframe: editor, nothing selected, caption playing.
  390x844 dp, dark theme; rules in assets/wireframes/style.md.
  Specs: editor-preview.md, timeline-slice3.md, timeline-slice5.md, transitions-slice12.md,
  voiceover-slice14.md, captions-slice16.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <style>
    text{font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:14px;fill:#E2E2E9}
    .tl{font-size:22px;font-weight:500}.ll{font-weight:500}.lm{font-size:12px;font-weight:500;fill:#C4C6D0}
    .ls{font-size:11px;fill:#C4C6D0}.bm{fill:#C4C6D0}.sc{fill:#E8DEF8}.m{text-anchor:middle}.e{text-anchor:end}
    .cap{font-size:22px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px}
  </style>
  <defs>
    <g id="i-back"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></g>
    <g id="i-undo"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></g>
    <g id="i-redo"><path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7z"/></g>
    <g id="i-export"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></g>
    <g id="i-prev"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></g>
    <g id="i-play"><path fill="currentColor" d="M8 5v14l11-7z"/></g>
    <g id="i-next"><path fill="currentColor" d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></g>
    <g id="i-snap"><path fill="currentColor" d="M4 4h6v8a2 2 0 0 0 4 0V4h6v8a8 8 0 0 1-16 0z"/></g>
    <g id="i-zoomin" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5 20 20M10 7v6M7 10h6"/></g>
    <g id="i-fit" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></g>
    <g id="i-overlay" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="6" height="5" fill="currentColor" stroke="none"/></g>
    <g id="i-text"><path fill="currentColor" d="M5 4v3h5.5v12h3V7H19V4z"/></g>
    <g id="i-captions" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 12h3M13 12h4M7 15h7"/></g>
    <g id="i-audio"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3z"/></g>
    <g id="i-mic"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72z"/></g>
    <g id="i-mixer" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></g>
    <g id="i-canvas" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 13v2h3M17 11V9h-3"/></g>
    <pattern id="ta" x="-45" y="540" width="114" height="64" patternUnits="userSpaceOnUse"><rect width="114" height="64" fill="#3B3F47"/><path d="M0 64 38 30l26 18 20-12 30 28z" fill="#4D525B"/><circle cx="92" cy="16" r="7" fill="#4D525B"/><rect x="113" width="1" height="64" fill="#111318"/></pattern>
    <pattern id="tb" x="100" y="540" width="114" height="64" patternUnits="userSpaceOnUse"><rect width="114" height="64" fill="#33404F"/><path d="M0 64 30 36l30 20 24-16 30 24z" fill="#465669"/><circle cx="24" cy="18" r="7" fill="#465669"/><rect x="113" width="1" height="64" fill="#111318"/></pattern>
    <pattern id="wv" x="40" y="608" width="64" height="64" patternUnits="userSpaceOnUse"><path stroke="#FFD8E4" stroke-width="2" d="M1 26v12M5 22v20M9 18v28M13 23v18M17 27v10M21 20v24M25 14v36M29 17v30M33 24v16M37 21v22M41 12v40M45 19v26M49 25v14M53 22v20M57 17v30M61 23v18"/></pattern>
  </defs>

  <rect width="390" height="844" fill="#111318"/>

  <!-- Status bar and top app bar -->
  <text x="16" y="17" class="ll">9:41</text>
  <path fill="#E2E2E9" d="M330 9h10v8h-10zM346 17h12V7zM362 7h7v11h-7z"/>
  <g color="#E2E2E9"><use href="#i-back" x="16" y="44"/><use href="#i-undo" x="262" y="44"/><use href="#i-redo" x="302" y="44" opacity=".38"/><use href="#i-export" x="350" y="44"/></g>
  <text x="56" y="63" class="tl">Summer Vacation</text>

  <!-- Preview with a caption; the spoken word in the highlight color -->
  <rect y="88" width="390" height="300" fill="#000"/>
  <rect y="129" width="390" height="219" fill="#2A2D34"/>
  <circle cx="300" cy="180" r="18" fill="#3A3E46"/>
  <path d="M0 348 100 236l70 64 60-50 160 98z" fill="#3A3E46"/>
  <text x="195" y="300" class="cap m">So we <tspan fill="#FDD835">went</tspan> down to</text>
  <text x="195" y="328" class="cap m">the river</text>

  <!-- Playback bar -->
  <g color="#E2E2E9"><use href="#i-prev" x="16" y="400"/><use href="#i-play" x="64" y="400"/><use href="#i-next" x="112" y="400"/></g>
  <text x="374" y="417" class="bm e">0:05 / 1:23</text>

  <!-- Ruler -->
  <path stroke="#938F99" d="M3 460v8M51 460v8M99 460v8M147 460v8M195 460v8M243 460v8M291 460v8M339 460v8M387 460v8M27 464v4M75 464v4M123 464v4M171 464v4M219 464v4M267 464v4M315 464v4M363 464v4"/>
  <text x="7" y="456" class="ls">0:01</text><text x="55" y="456" class="ls">0:02</text><text x="103" y="456" class="ls">0:03</text><text x="151" y="456" class="ls">0:04</text>
  <text x="247" y="456" class="ls">0:06</text><text x="295" y="456" class="ls">0:07</text><text x="343" y="456" class="ls">0:08</text>

  <!-- Caption lane -->
  <rect x="60" y="472" width="116" height="64" rx="4" fill="#4A4458"/>
  <text x="68" y="508" class="lm sc">So we went&#8230;</text>
  <rect x="178" y="472" width="122" height="64" rx="4" fill="#4A4458"/>
  <text x="186" y="508" class="lm sc">the river</text>

  <!-- Base video track with a plain cut badge -->
  <rect x="-45" y="540" width="143" height="64" rx="4" fill="url(#ta)"/>
  <rect x="100" y="540" width="300" height="64" rx="4" fill="url(#tb)"/>
  <rect x="58" y="584" width="30" height="16" rx="4" fill="#000" opacity=".6"/>
  <text x="73" y="596" class="ls m">3.0s</text>
  <rect x="91" y="564" width="16" height="16" rx="4" fill="#E2E2E9"/>
  <rect x="98" y="567" width="2" height="10" fill="#111318"/>

  <!-- Music lane with a fade-in -->
  <rect x="40" y="608" width="360" height="64" rx="4" fill="#633B48"/>
  <rect x="44" y="612" width="356" height="56" fill="url(#wv)" opacity=".5"/>
  <path d="M40 608v64l40-64z" fill="#000" opacity=".4"/>

  <!-- Fixed center playhead -->
  <path d="M188 452h14l-7 9z" fill="#AEC6FF"/>
  <rect x="194" y="458" width="2" height="214" fill="#AEC6FF"/>

  <!-- Timeline controls: snap (on), zoom to playhead, zoom to fit -->
  <rect x="250" y="684" width="40" height="40" rx="20" fill="#11448F"/>
  <use href="#i-snap" x="258" y="692" color="#D7E2FF"/>
  <g color="#C4C6D0"><use href="#i-zoomin" x="302" y="692"/><use href="#i-fit" x="350" y="692"/></g>

  <!-- Tool row, scrolls sideways -->
  <rect y="736" width="390" height="108" fill="#44474E"/>
  <g color="#E2E2E9">
    <use href="#i-overlay" x="28" y="752"/><use href="#i-text" x="92" y="752"/><use href="#i-captions" x="156" y="752"/>
    <use href="#i-audio" x="220" y="752"/><use href="#i-mic" x="284" y="752"/><use href="#i-mixer" x="348" y="752"/>
    <use href="#i-canvas" x="412" y="752"/>
  </g>
  <text x="40" y="798" class="lm m">Overlay</text><text x="104" y="798" class="lm m">Text</text><text x="168" y="798" class="lm m">Captions</text>
  <text x="232" y="798" class="lm m">Audio</text><text x="296" y="798" class="lm m">Voiceover</text><text x="360" y="798" class="lm m">Mixer</text>
  <text x="424" y="798" class="lm m">Canvas</text>

  <rect x="141" y="832" width="108" height="4" rx="2" fill="#E2E2E9"/>
</svg>
