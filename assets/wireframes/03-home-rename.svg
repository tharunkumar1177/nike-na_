<!--
  Framecraft wireframe: home, rename project dialog.
  390x844 dp, dark theme; rules in assets/wireframes/style.md.
  Spec: assets/wireframes/home-projects.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <style>
    text{font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:14px;fill:#E2E2E9}
    .tl{font-size:22px;font-weight:500}.hs{font-size:24px;font-weight:700}.bl{font-size:16px}
    .ll{font-weight:500}.lm{font-size:12px;font-weight:500}.bm{fill:#C4C6D0}.p{fill:#AEC6FF}.pc{fill:#D7E2FF}.er{fill:#F2B8B5}
    .m{text-anchor:middle}.e{text-anchor:end}
  </style>
  <defs>
    <g id="i-more"><path fill="currentColor" d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></g>
    <g id="i-add" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g>
  </defs>

  <rect width="390" height="844" fill="#111318"/>
  <text x="16" y="17" class="ll">9:41</text>
  <path fill="#E2E2E9" d="M330 9h10v8h-10zM346 17h12V7zM362 7h7v11h-7z"/>
  <text x="195" y="63" class="tl m">Framecraft</text>
  <g color="#C4C6D0">
    <use href="#i-more" x="350" y="112"/>
    <use href="#i-more" x="350" y="184"/>
    <use href="#i-more" x="350" y="256"/>
  </g>
  <text x="16" y="117" class="bl">Summer Vacation</text>
  <text x="16" y="141" class="bm">Edited 5 min ago &#8226; 1:23 &#8226; 4 clips</text>
  <text x="16" y="189" class="bl">Birthday Party</text>
  <text x="16" y="213" class="bm">Edited yesterday &#8226; 0:15 &#8226; 1 clip</text>
  <text x="16" y="261" class="bl">Unreadable project</text>
  <text x="16" y="285" class="er">Couldn't read project file</text>
  <rect x="111" y="748" width="168" height="56" rx="28" fill="#11448F"/>
  <use href="#i-add" x="137" y="764" color="#D7E2FF"/>
  <text x="173" y="781" class="ll pc">New project</text>

  <!-- Scrim and dialog -->
  <rect width="390" height="844" fill="#000" opacity=".32"/>
  <rect x="39" y="290" width="312" height="236" rx="28" fill="#2B2930"/>
  <text x="63" y="338" class="hs">Rename project</text>
  <rect x="63" y="362" width="264" height="56" rx="4" fill="none" stroke="#AEC6FF" stroke-width="2"/>
  <rect x="71" y="356" width="84" height="12" fill="#2B2930"/>
  <text x="75" y="366" class="lm p">Project name</text>
  <text x="79" y="396" class="bl">Summer Vacation</text>
  <rect x="207" y="380" width="2" height="22" fill="#AEC6FF"/>
  <text x="251" y="494" class="ll p e">Cancel</text>
  <text x="327" y="494" class="ll p e">Rename</text>

  <rect x="141" y="832" width="108" height="4" rx="2" fill="#E2E2E9"/>
</svg>
